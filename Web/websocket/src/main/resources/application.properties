spring.application.name=webSocket
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
server.port=0

spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=Websocket-listeners
spring.kafka.consumer.properties.spring.json.trusted.packages=by.gsu.scherbak.orderLibrary

kafka.consumer.topics=Orders-topic

